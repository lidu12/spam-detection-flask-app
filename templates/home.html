<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>
</head>
<body>

<h2>Spam Detection App</h2>

<a href="/logout">Logout</a>

<form method="POST">
    <input name="message" placeholder="Enter message" required>
    <button type="submit">Check</button>
</form>

{% if result %}
    <h3>{{ result }}</h3>
{% endif %}

</body>
</html>
