<h2>Spam Detector</h2>

<a href="/logout">Logout</a>

<form method="POST">
    <input name="message" placeholder="Enter message" required>
    <button>Check</button>
</form>

{% if result %}
    <h3>{{ result }}</h3>
{% endif %}

<h3>History</h3>
<ul>
    {% for item in history %}
        <li>{{ item.message }} → {{ item.result }}</li>
    {% endfor %}
</ul>
